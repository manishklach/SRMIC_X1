title: SRMIC | Residency-First LLM Inference Architecture
description: "SRMIC (SRAM-centric Residency-first Memory-centric Inference) is a distributed on-package SRAM architecture designed to eliminate HBM bottlenecks in LLM decode."
baseurl: "/SRMIC_X1"
url: "https://manishklach.github.io"

# Canonical Naming
brand_name: "SRMIC"
brand_tagline: "Residency-First LLM Inference Architecture"
expansion: "SRAM-centric Residency-first Memory-centric Inference"

# SEO
twitter:
  username: manishklach
  card: summary_large_image
logo: /assets/images/srmic_logo.svg

# Build settings
permalink: pretty
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# Custom Collections
collections:
  artifacts:
    output: true
    permalink: /artifacts/:path/

exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
