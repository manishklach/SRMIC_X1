name: SRMIC Runtime CI Study

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  runtime_study:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r srmic_runtime/requirements.txt

    - name: Run CI Runtime Study
      run: |
        python studies/runtime/run_study.py

    - name: Verify CLI (Dry-Run)
      run: |
        python -m srmic_runtime.main --dry-run --hrm-budgets 1 4 7 10 --tokens 20 --output results_ci/
