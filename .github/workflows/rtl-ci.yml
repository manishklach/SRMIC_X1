name: SRMIC RTL CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Run Lint
        run: make lint

  sim:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      matrix:
        seed: [1234, 5678, 9999, 42, 31337]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install -y verilator
      - name: Run Simulation seed=${{ matrix.seed }}
        run: make sim SEED=${{ matrix.seed }}
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: sim-results-seed-${{ matrix.seed }}
          path: build/sim_results.log

  sim-summary:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - name: Download all results
        uses: actions/download-artifact@v4
        with:
          pattern: sim-results-seed-*
          merge-multiple: true
      - name: Check all seeds passed
        run: |
          echo "=== Multi-Seed Simulation Summary ==="
          FAILED=0
          for f in sim_results*.log; do
            status=$(grep 'status=' $f | cut -d= -f2 | tr -d '\r')
            echo "$f: $status"
            if [ "$status" != "PASS" ]; then
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo "One or more seeds FAILED"
            exit 1
          fi
          echo "All seeds PASSED"

  synth:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y yosys
      - name: Run Synthesis
        run: make synth

  formal:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Formal
        run: |
          # Only run if sby is installed (avoid CI failure on public runners)
          if command -v sby > /dev/null; then
            make formal
          else
            echo "sby not found, skipping formal verification"
          fi
