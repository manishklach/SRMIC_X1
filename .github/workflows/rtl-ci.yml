name: SRMIC RTL CI Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  build_and_verify:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Install tools directly from Ubuntu repos
    - name: Install Verilator + Yosys
      run: |
        sudo apt-get update
        sudo apt-get install -y verilator yosys

    # Optional: install SMT solver for formal
    - name: Install SMT Solver (for formal)
      run: |
        sudo apt-get install -y boolector

    - name: Run Verilator Lint
      run: make lint

    - name: Run Simulation
      run: make sim

    - name: Run Synthesis Sanity
      run: make synth

    - name: Run Formal Verification
      run: make formal

    - name: Install Python Dependencies (for runtime study)
      run: |
        pip install pandas matplotlib torch transformers

    - name: Run Runtime Study
      run: |
        python studies/runtime/run_study.py